[isort]
profile = black
line_length = 88
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True

# Import order
known_first_party = adk_agents,adk_orchestrator,quality_evaluator,observability
known_third_party = fastapi,uvicorn,pytest,google,pydantic

# Sections
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER

# Skip files
skip_glob = */venv/*,*/.venv/*,*/node_modules/*
