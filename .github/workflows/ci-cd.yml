name: CROSSFIRE CI/CD Pipeline

on:
  push:
    branches: [develop, 'release/**']
  pull_request:
    branches: [develop, main]

env:
  GCP_PROJECT_ID: aipodcaster-481909
  GCP_REGION: us-central1
  SERVICE_NAME: crossfire-backend

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          cd backend
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest --cov=. --cov-report=xml --cov-report=term-missing -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: crossfire-backend-coverage

  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install linters
        run: |
          pip install flake8 black==25.12.0

      - name: Run black
        run: |
          cd backend
          black --check .

      - name: Run flake8
        run: |
          cd backend
          flake8 . --max-line-length=127 --exclude=venv,__pycache__

  build:
    name: Build Docker Image
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and push Docker image
        run: |
          cd backend
          # Registry format: us-central1-docker.pkg.dev/PROJECT-ID/REPOSITORY/IMAGE:TAG
          # We'll use a repository named 'crossfire'
          IMAGE_PATH="us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/crossfire/${{ env.SERVICE_NAME }}"

          docker build -t $IMAGE_PATH:${{ github.sha }} .
          docker tag $IMAGE_PATH:${{ github.sha }} $IMAGE_PATH:latest

          docker push $IMAGE_PATH:${{ github.sha }}
          docker push $IMAGE_PATH:latest

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run (Staging)
        run: |
          IMAGE_PATH="us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/crossfire/${{ env.SERVICE_NAME }}"
          gcloud run deploy ${{ env.SERVICE_NAME }}-staging \
            --image $IMAGE_PATH:${{ github.sha }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --service-account crossfire-ci-cd@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --memory 2Gi \
            --set-env-vars ENVIRONMENT=staging \
            --tag staging

      - name: Get service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }}-staging \
            --region ${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "Staging URL: $URL"

  deploy-production:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/release/')
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run (Production)
        run: |
          IMAGE_PATH="us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/crossfire/${{ env.SERVICE_NAME }}"
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image $IMAGE_PATH:${{ github.sha }} \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 10 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --service-account crossfire-ci-cd@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --set-env-vars ENVIRONMENT=production \
            --tag production

      - name: Create git tag
        id: create_tag
        run: |
          VERSION=$(echo ${{ github.ref }} | sed 's/refs\/heads\/release\///')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          git tag $VERSION || echo "Tag $VERSION already exists"
          git push origin $VERSION || echo "Tag $VERSION already pushed"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.VERSION }}
          release_name: CROSSFIRE ${{ env.VERSION }}
          body: |
            Production deployment of CROSSFIRE

            ## Metrics
            - Tests: 26+ passing
            - Coverage: 58%
            - Quality: Coherence 0.96, Safety 0.92
          draft: false
          prerelease: false

  deploy-frontend-staging:
    needs: build
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://crossfire-backend-staging-252094635698.us-central1.run.app
    steps:
      - uses: actions/checkout@v3

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Frontend (Staging)
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.BACKEND_URL }} \
            -t us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/crossfire/frontend-staging:${{ github.sha }} \
            -f Dockerfile.frontend .
          docker push us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/crossfire/frontend-staging:${{ github.sha }}

      - name: Deploy Frontend to Cloud Run (Staging)
        run: |
          gcloud run deploy crossfire-frontend-staging \
            --image us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/crossfire/frontend-staging:${{ github.sha }} \
            --service-account crossfire-ci-cd@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --memory 1Gi

  deploy-frontend-production:
    needs: deploy-production
    if: startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: https://crossfire-backend-252094635698.us-central1.run.app
    steps:
      - uses: actions/checkout@v3

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Frontend (Production)
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=${{ env.BACKEND_URL }} \
            -t us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/crossfire/frontend:${{ github.sha }} \
            -f Dockerfile.frontend .
          docker push us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/crossfire/frontend:${{ github.sha }}

      - name: Deploy Frontend to Cloud Run (Production)
        run: |
          gcloud run deploy crossfire-frontend \
            --image us-central1-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/crossfire/frontend:${{ github.sha }} \
            --service-account crossfire-ci-cd@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --platform managed \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --memory 1Gi
